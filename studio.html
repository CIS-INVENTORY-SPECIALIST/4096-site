<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4096 — Avatar Studio</title>
<style>
  :root{--paper:#eeeeea;--ink:#1b1b19;--rule:#d2d2ca;
    --mono:"IBM Plex Mono",ui-monospace,monospace;}
  html,body{margin:0;height:100%;background:#e9e7e0;font-family:var(--mono);color:var(--ink);}
  #c{display:block;position:fixed;inset:0;}
  #panel{position:fixed;top:14px;left:14px;z-index:5;background:var(--paper);border:1px solid var(--rule);
    padding:16px 18px;width:280px;font-size:11px;line-height:1.7;box-shadow:0 8px 30px rgba(27,27,25,.18);}
  #panel h1{margin:0 0 2px;font-size:12px;letter-spacing:.28em;font-weight:500;}
  #panel .sub{color:#84847c;font-size:9.5px;letter-spacing:.12em;margin-bottom:12px;}
  #panel label{display:block;margin-top:10px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#84847c;}
  #panel input[type=range]{width:100%;}
  #panel input[type=file]{width:100%;font-size:10px;margin-top:4px;}
  #readout{margin-top:12px;padding:10px;background:#fff;border:1px solid var(--rule);
    font-size:10.5px;white-space:pre;line-height:1.8;}
  #status{margin-top:8px;color:#84847c;font-size:9.5px;line-height:1.5;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>AVATAR STUDIO</h1>
  <div class="sub">4096 · gallery light, patron scale</div>
  <label>load a .glb (Ready Player Me export)</label>
  <input type="file" id="file" accept=".glb,.gltf">
  <label>arms down · <span id="v-arm">0</span>°</label>
  <input type="range" id="arm" min="0" max="80" value="0" step="1">
  <label>height · <span id="v-scale">1.70</span> m</label>
  <input type="range" id="scale" min="1.4" max="2.0" value="1.7" step="0.01">
  <label>rotation · <span id="v-rot">0</span>°</label>
  <input type="range" id="rot" min="-180" max="180" value="0" step="1">
  <div id="readout">arm 0° · height 1.70m · rot 0°</div>
  <div id="status">no file loaded — showing the stand-in. drop in a .glb to see it under gallery light.</div>
</div>
<script type="importmap">
{ "imports": {
  "three": "./gallery/vendor/three/three.module.js",
  "three/addons/": "./gallery/vendor/three/addons/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;                          // the gallery's exposure

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e7e0);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 50);
camera.position.set(0, 1.5, 3.4); camera.lookAt(0, 1.0, 0);

// the gallery's light recipe: warm key + soft ambient fill over a wood-toned ground
const key = new THREE.DirectionalLight(0xfff6ea, 0.32);
key.position.set(4, 11, 7); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); scene.add(key);
scene.add(new THREE.AmbientLight(0xfff8f0, 0.75));
scene.add(new THREE.HemisphereLight(0xf4f2ec, 0xa08b6a, 0.35));
const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 40),
  new THREE.MeshStandardMaterial({ color: 0xa5814f, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.32, 24),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.14, depthWrite: false }));
shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.01; scene.add(shadow);

// ---- avatar state ----
let avatar = null;            // the loaded (or stand-in) root
let armBones = [];            // {bone, side} — bones matched for arms-down posing
let baseHeight = 1.7;         // natural height of the loaded model, for scale math

function clearAvatar() { if (avatar) { scene.remove(avatar); avatar = null; armBones = []; } }

// stand-in so the light/controls are provable before any real file exists
function standIn() {
  clearAvatar();
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0xcfc9bd, roughness: 0.9 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 0.62, 6, 14), mat);
  body.position.y = 0.95; body.castShadow = true; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), mat);
  head.position.y = 1.52; head.castShadow = true; g.add(head);
  for (const s of [-1, 1]) {
    const pivot = new THREE.Group(); pivot.position.set(s * 0.21, 1.28, 0);
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.045, 0.46, 4, 10), mat);
    arm.position.y = -0.27; arm.castShadow = true; pivot.add(arm);
    pivot.rotation.z = s * Math.PI / 2;             // A-pose out to the sides, like a raw export
    g.add(pivot); armBones.push({ bone: pivot, side: s, rest: s * Math.PI / 2 });
  }
  for (const s of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.55, 4, 10), mat);
    leg.position.set(s * 0.09, 0.38, 0); leg.castShadow = true; g.add(leg);
  }
  baseHeight = 1.63; avatar = g; scene.add(g); apply();
}

function adoptGLTF(gltf, name) {
  clearAvatar();
  avatar = gltf.scene;
  avatar.traverse(o => {
    if (o.isMesh) { o.castShadow = true; }
    if (o.isBone && /^(Left|Right)(Arm|UpperArm|Shoulder_?Arm)$|(Left|Right)Arm$/i.test(o.name)) {
      const side = /left/i.test(o.name) ? -1 : 1;
      armBones.push({ bone: o, side, rest: o.rotation.z });
    }
  });
  const box = new THREE.Box3().setFromObject(avatar);
  baseHeight = Math.max(0.2, box.max.y - box.min.y);
  avatar.position.y = -box.min.y;                    // feet on the floor
  scene.add(avatar); apply();
  document.getElementById('status').textContent =
    name + ' loaded · height ' + baseHeight.toFixed(2) + 'm · ' +
    (armBones.length ? armBones.length + ' arm bones found (slider poses them)' :
     'no arm bones matched — slider inert for this file; pose arms in the export tool instead');
}

document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const url = URL.createObjectURL(f);
  new GLTFLoader().load(url, g => adoptGLTF(g, f.name),
    undefined, err => { document.getElementById('status').textContent = 'could not load: ' + err.message; });
});
// also try a conventional default path, so a committed avatar shows up on plain load
new GLTFLoader().load('gallery/avatars/patron.glb', g => adoptGLTF(g, 'gallery/avatars/patron.glb'),
  undefined, () => standIn());

// ---- controls ----
const els = { arm: document.getElementById('arm'), scale: document.getElementById('scale'), rot: document.getElementById('rot') };
function apply() {
  if (!avatar) return;
  const armDeg = +els.arm.value, height = +els.scale.value, rotDeg = +els.rot.value;
  for (const a of armBones) a.bone.rotation.z = a.rest - a.side * THREE.MathUtils.degToRad(armDeg);
  const s = height / baseHeight;
  avatar.scale.setScalar(s);
  const box = new THREE.Box3().setFromObject(avatar);
  avatar.position.y -= box.min.y;                    // keep feet planted after scaling
  avatar.rotation.y = THREE.MathUtils.degToRad(rotDeg);
  document.getElementById('v-arm').textContent = armDeg;
  document.getElementById('v-scale').textContent = height.toFixed(2);
  document.getElementById('v-rot').textContent = rotDeg;
  document.getElementById('readout').textContent =
    'arm ' + armDeg + '° · height ' + height.toFixed(2) + 'm · rot ' + rotDeg + '°\n' +
    'scale factor ' + s.toFixed(3) + '  (transplant these into the gallery)';
}
for (const k in els) els[k].addEventListener('input', apply);

function fit() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', fit); fit();
let t = 0;
(function loop() { requestAnimationFrame(loop); renderer.render(scene, camera); })();
</script>
</body>
</html>
